<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>报账单管理系统</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <style>
    .expense-thumb { width: 96px; height: 96px; object-fit: cover; }
    .pending-photo { width: 100px; }
    .pending-photo img { width: 100px; height: 100px; object-fit: cover; }
    .pending-photo .filename { font-size: 0.75rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .expense-item { break-inside: avoid; page-break-inside: avoid; }
    #pdfContent.pdf-mode .expense-thumb {
      width: auto !important;
      height: auto !important;
      max-width: 100% !important;
      max-height: 360px !important;
      object-fit: contain !important;
    }
    #pdfContent.pdf-mode .no-pdf { display: none !important; }
    #pdfContent.pdf-mode { background: white; color: #212529; }
    #pdfContent.pdf-mode .expense-item { border-color: #dee2e6 !important; }
    /* 导出预览独立于 Bootstrap 卡片，不把网页布局直接打印到 PDF。 */
    #exportPreview[hidden] { display: none !important; }
    .export-overlay {
      position: fixed; inset: 0; z-index: 10000; overflow-y: auto;
      background: #e9edf2; padding: 12px 10px 28px;
    }
    .preview-open { overflow: hidden; }
    .export-toolbar {
      position: sticky; top: 0; z-index: 1; max-width: 210mm;
      margin: 0 auto 12px; padding: 12px; background: white;
      box-shadow: 0 2px 10px #0002; border-radius: 8px;
    }
    .print-sheet {
      box-sizing: border-box; max-width: 210mm; min-height: 297mm;
      margin: auto; padding: 14mm; background: white;
      box-shadow: 0 3px 18px #0002;
    }
    .print-document { color: #222; font-family: -apple-system, BlinkMacSystemFont,
      "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      font-size: 11pt; line-height: 1.55; overflow-wrap: anywhere; }
    .print-document * { box-sizing: border-box; }
    .print-heading { text-align: center; font-size: 20pt; margin: 0 0 2mm; font-weight: 700; }
    .print-date { text-align: right; font-size: 9pt; color: #555; margin-bottom: 6mm; }
    .print-table { width: 100%; border-collapse: collapse; table-layout: fixed; margin: 0 0 8mm; }
    .print-table th, .print-table td { border: 1px solid #bfc7cf; padding: 2.5mm 3mm; vertical-align: top; }
    .print-table th { background: #f2f5f8; font-weight: 700; }
    .print-table .money { text-align: right; width: 28%; white-space: nowrap; }
    .print-table .number { width: 13%; text-align: center; }
    .print-table .total-row { font-weight: 700; background: #f7f8fa; }
    .print-section-title { font-size: 13pt; font-weight: 700; margin: 3mm 0; padding-bottom: 2mm; border-bottom: 1px solid #bbb; }
    .print-entry { margin: 0 0 7mm; }
    .print-entry-heading {
      display: flex; justify-content: space-between; gap: 3mm;
      background: #f2f5f8; padding: 2mm 3mm; font-weight: 700;
      break-after: avoid; page-break-after: avoid;
    }
    .print-remark { white-space: pre-wrap; margin: 2mm 3mm 3mm; overflow-wrap: anywhere; }
    .print-photo { margin: 3mm 0 5mm; text-align: center; break-inside: avoid; page-break-inside: avoid; }
    .print-photo img {
      display: block; width: auto; height: auto; max-width: 100%;
      max-height: 135mm; object-fit: contain; margin: 0 auto;
      border: 1px solid #d9d9d9;
    }
    .print-photo figcaption { color: #666; font-size: 9pt; margin-top: 1.5mm; }
    @media (max-width: 600px) {
      .print-sheet { padding: 5mm; min-height: auto; }
      .print-document { font-size: 10pt; }
      .print-heading { font-size: 17pt; }
    }
    @media print {
      @page { size: A4; margin: 13mm; }
      html, body { margin: 0 !important; padding: 0 !important;
        background: white !important; overflow: visible !important; }
      body > main { display: none !important; }
      #exportPreview { display: block !important; position: static !important;
        inset: auto !important; overflow: visible !important; padding: 0 !important;
        margin: 0 !important; background: white !important; }
      .export-toolbar { display: none !important; }
      .print-sheet { max-width: none !important; min-height: auto !important;
        padding: 0 !important; margin: 0 !important; box-shadow: none !important; }
      .print-document { font-size: 10.5pt !important; }
      .print-table thead { display: table-header-group; }
      .print-table tr { break-inside: avoid; page-break-inside: avoid; }
      .print-heading, .print-section-title { break-after: avoid; page-break-after: avoid; }
      .print-photo img { max-height: 135mm !important; }
      .print-entry-heading, .print-table th, .print-table .total-row {
        print-color-adjust: exact; -webkit-print-color-adjust: exact;
      }
    }
  </style>
</head>
<body class="bg-light">
  <main class="container-fluid py-4 px-3 px-md-4">
    <h3 class="mb-2">崔莹边吃💩边报账的系统</h3>
    <p class="text-secondary small mb-4"></p>
    <div class="row g-4">
      <!-- 左侧：新增报账 -->
      <section class="col-12 col-lg-5">
        <div class="card shadow-sm">
          <div class="card-header bg-primary text-white">添加报账</div>
          <div class="card-body">
            <form id="expenseForm">
              <div class="mb-3">
                <label for="category" class="form-label">
                  报账类别
                  <small class="text-muted">⬇这里选报账的类别, 你也没说都有什么, 想加来求我</small>
                </label>
                <select id="category" class="form-select" required>
                  <option value="" selected disabled>请选择类别</option>
                  <option value="酒水">酒水</option>
                  <option value="房租">房租</option>
                  <option value="电费">电费</option>
                  <option value="水费">水费</option>
                  <option value="员工工资">员工工资</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="amount" class="form-label">
                  报账金额（人民币）
                  <small class="text-muted">⬇这里写多少钱</small>
                </label>
                <div class="input-group">
                  <span class="input-group-text">¥</span>
                  <input type="number" id="amount" class="form-control" step="0.01" min="0.01" required placeholder="请输入金额" aria-label="报账金额（人民币）">
                </div>
              </div>
              <div class="mb-3">
                <label for="remark" class="form-label">
                  备注
                  <small class="text-muted">⬇这里写啥账, 数量什么的, 或者员工工资给谁开的工资等等</small>
                </label>
                <textarea id="remark" class="form-control" rows="3" placeholder="可以填写报账说明"></textarea>
              </div>
              <div class="mb-3">
                <label for="images" class="form-label">上传凭证图片</label>
                <input type="file" id="images" class="form-control" accept="image/*" multiple>
                <div class="form-text">
                  ⬆点这个传照片, 可以一次传多张, 别整太大哈, 怕你内存受不了,
                  最好一张不超过 15 MB。传完了点下面添加就到右边了
                </div>
                <div id="selectedImagesInfo" class="small text-secondary mt-2">本条记录尚未选择图片</div>
                <div id="selectedImagesPreview" class="d-flex flex-wrap gap-2 mt-2" aria-live="polite"></div>
              </div>
              <div class="d-grid">
                <button id="addBtn" type="submit" class="btn btn-primary" disabled>添加</button>
              </div>
            </form>
          </div>
        </div>
      </section>

      <!-- 右侧：记录及 PDF -->
      <section class="col-12 col-lg-7">
        <div class="card shadow-sm">
          <div class="card-header bg-primary text-white">报账记录</div>
          <div class="card-body">
            <div id="pdfContent" class="bg-white p-2 p-sm-3">
              <h4 class="text-center mb-4">崔莹报账单</h4>
              <div id="expenseList"><p class="text-muted">正在读取草稿...</p></div>
              <hr>
              <h5 class="text-end">总金额：<span id="totalAmount">¥0.00</span></h5>
            </div>
            <div class="row g-2 mt-3">
              <div class="col-12 col-sm-6">
                <button id="generatePdfBtn" type="button" class="btn btn-success btn-lg w-100" disabled>生成 PDF</button>
                <small class="text-muted">⬆先预览 A4 报账单（包含图片），再选择打印或保存为 PDF。</small>
              </div>
              <div class="col-12 col-sm-6">
                <button id="clearBtn" type="button" class="btn btn-outline-danger btn-lg w-100" disabled>清空报账单</button>
                <small class="text-muted">⬆这个别瞎他妈点, 点完全没了,还得重新传, 等你传报表或者想重新生成一张再点, 清一下缓存</small>
              </div>
            </div>
            <p id="saveStatus" class="small text-secondary mt-3 mb-0" role="status" aria-live="polite">正在加载草稿...</p>
          </div>
        </div>
      </section>
    </div>
  </main>

  <!-- PDF 专用预览：不使用页面右侧的缩略图，不依赖临时 blob: 图片地址。 -->
  <div id="exportPreview" class="export-overlay" hidden role="dialog" aria-modal="true" aria-label="报账单 PDF 预览">
    <div class="export-toolbar">
      <div class="fw-bold mb-1">报账单 PDF 预览</div>
      <div id="previewStatus" class="small text-secondary mb-2" role="status" aria-live="polite">正在准备图片...</div>
      <div class="d-flex flex-wrap gap-2">
        <button id="confirmPrintBtn" class="btn btn-success" type="button" disabled>打印 / 保存 PDF</button>
        <button id="closePreviewBtn" class="btn btn-outline-secondary" type="button">返回编辑</button>
      </div>
      <div class="small text-secondary mt-2">iPhone：点击打印后，在系统预览中分享并存储到「文件」。请先确认下面能看到所有照片。</div>
    </div>
    <div class="print-sheet"><div id="printDocument" class="print-document"></div></div>
  </div>

  <script>
    "use strict";

    let expenses = [];
    let nextId = 1;
    // 暂存正在填写的这条记录选中的图片，支持分多次选择。
    let pendingImages = [];
    let nextPendingImageId = 1;
    const form = document.getElementById("expenseForm");
    const expenseList = document.getElementById("expenseList");
    const totalAmount = document.getElementById("totalAmount");
    const saveStatus = document.getElementById("saveStatus");
    const addBtn = document.getElementById("addBtn");
    const generatePdfBtn = document.getElementById("generatePdfBtn");
    const clearBtn = document.getElementById("clearBtn");
    const exportPreview = document.getElementById("exportPreview");
    const previewStatus = document.getElementById("previewStatus");
    const printDocument = document.getElementById("printDocument");
    const confirmPrintBtn = document.getElementById("confirmPrintBtn");
    const closePreviewBtn = document.getElementById("closePreviewBtn");
    let isClearing = false;
    // 将 IndexedDB 写操作按先后顺序排队，防止“添加后立即清空”时旧草稿再次写回。
    let lastDraftWrite = Promise.resolve();
    function queueDraftWrite(task) {
      const result = lastDraftWrite.then(task);
      lastDraftWrite = result.catch(() => {});
      return result;
    }
    const moneyFormatter = new Intl.NumberFormat("zh-CN", {
      style: "currency", currency: "CNY", minimumFractionDigits: 2, maximumFractionDigits: 2
    });
    function formatMoney(amount) {
      return moneyFormatter.format(Number(amount) || 0);
    }
    const pdfContent = document.getElementById("pdfContent");
    const imagesInput = document.getElementById("images");
    const selectedImagesPreview = document.getElementById("selectedImagesPreview");
    const selectedImagesInfo = document.getElementById("selectedImagesInfo");

    function renderSelectedImages() {
      selectedImagesPreview.replaceChildren();
      selectedImagesInfo.textContent = pendingImages.length
        ? `本条记录已选择 ${pendingImages.length} 张图片（可继续追加）`
        : "本条记录尚未选择图片";

      for (const entry of pendingImages) {
        const wrapper = document.createElement("div");
        wrapper.className = "pending-photo border rounded p-1";

        const img = document.createElement("img");
        img.src = entry.url;
        img.alt = entry.file.name;
        img.className = "rounded";

        const filename = document.createElement("div");
        filename.className = "filename";
        filename.textContent = entry.file.name;
        filename.title = entry.file.name;

        const removeBtn = document.createElement("button");
        removeBtn.type = "button";
        removeBtn.className = "btn btn-outline-danger btn-sm w-100 mt-1";
        removeBtn.textContent = "移除";
        removeBtn.addEventListener("click", () => {
          pendingImages = pendingImages.filter(item => item.id !== entry.id);
          URL.revokeObjectURL(entry.url);
          renderSelectedImages();
        });

        wrapper.append(img, filename, removeBtn);
        selectedImagesPreview.appendChild(wrapper);
      }
    }

    // 多次打开文件选择器时，保留之前选好的照片，而不是覆盖。
    imagesInput.addEventListener("change", () => {
      const newFiles = Array.from(imagesInput.files || []);
      for (const file of newFiles) {
        if (!file.type.startsWith("image/")) {
          alert(`文件不是图片：${file.name}`);
          continue;
        }
        if (file.size > 15 * 1024 * 1024) {
          alert(`图片超过 15 MB：${file.name}`);
          continue;
        }
        const alreadyAdded = pendingImages.some(item =>
          item.file.name === file.name &&
          item.file.size === file.size &&
          item.file.lastModified === file.lastModified
        );
        if (!alreadyAdded) {
          pendingImages.push({
            id: nextPendingImageId++,
            file,
            url: URL.createObjectURL(file)
          });
        }
      }
      imagesInput.value = ""; // 允许再次选择同一组文件，也不会丢失已有的选择
      renderSelectedImages();
    });

    function clearSelectedImages() {
      pendingImages.forEach(item => URL.revokeObjectURL(item.url));
      pendingImages = [];
      renderSelectedImages();
    }

    // 用 IndexedDB 持久化整个报账列表，包括照片的 File 数据。
    const dbPromise = new Promise((resolve, reject) => {
      if (!window.indexedDB) {
        reject(new Error("当前浏览器不支持 IndexedDB"));
        return;
      }
      const request = indexedDB.open("ExpenseReportDB", 1);
      request.onupgradeneeded = () => {
        const db = request.result;
        if (!db.objectStoreNames.contains("drafts")) {
          db.createObjectStore("drafts");
        }
      };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });

    function saveDraft() {
      const data = expenses.map(({ imageUrls, ...record }) => record);
      return queueDraftWrite(async () => {
        const db = await dbPromise;
        return new Promise((resolve, reject) => {
          const tx = db.transaction("drafts", "readwrite");
          tx.objectStore("drafts").put(data, "current");
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error || new Error("写入草稿失败"));
          tx.onabort = () => reject(tx.error || new Error("草稿保存被中断"));
        });
      });
    }

    // 只删除当前报账草稿，不删除整个数据库，方便以后扩展多份草稿。
    function deleteCurrentDraft() {
      return queueDraftWrite(async () => {
        const db = await dbPromise;
        return new Promise((resolve, reject) => {
          const tx = db.transaction("drafts", "readwrite");
          tx.objectStore("drafts").delete("current");
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error || new Error("清空草稿失败"));
          tx.onabort = () => reject(tx.error || new Error("清空草稿被中断"));
        });
      });
    }

    async function loadDraft() {
      const db = await dbPromise;
      return new Promise((resolve, reject) => {
        const tx = db.transaction("drafts", "readonly");
        const request = tx.objectStore("drafts").get("current");
        request.onsuccess = () => resolve(request.result || []);
        request.onerror = () => reject(request.error);
      });
    }

    function updateSaveStatus(text, error = false) {
      saveStatus.textContent = text;
      saveStatus.className = error
        ? "small text-danger mt-3 mb-0"
        : "small text-secondary mt-3 mb-0";
    }

    function makePreviewUrls(files) {
      return files.map(file => URL.createObjectURL(file));
    }

    // 只创建新记录的节点，删除记录时不重建其他图片。
    // 旧实现 replaceChildren() 会重新加载所有 blob: 图片地址，
    // 在部分手机浏览器中可能导致其他图片显示成问号。
    function createExpenseElement(expense) {
      const item = document.createElement("div");
      item.className = "expense-item border rounded p-3 mb-3";
      item.dataset.expenseId = String(expense.id);

      const header = document.createElement("div");
      header.className = "d-flex justify-content-between align-items-center gap-2";
      const category = document.createElement("strong");
      category.textContent = expense.category;
      const amount = document.createElement("strong");
      amount.textContent = formatMoney(expense.amount);
      header.append(category, amount);
      item.appendChild(header);

      if (expense.remark) {
        const remark = document.createElement("p");
        remark.className = "text-secondary mt-2 mb-2";
        remark.style.whiteSpace = "pre-wrap";
        remark.textContent = expense.remark;
        item.appendChild(remark);
      }

      if (expense.imageUrls.length) {
        const photos = document.createElement("div");
        photos.className = "d-flex flex-wrap gap-2 mt-2";
        for (const url of expense.imageUrls) {
          const img = document.createElement("img");
          img.className = "img-thumbnail expense-thumb";
          img.alt = "凭证照片";
          img.src = url;
          photos.appendChild(img);
        }
        item.appendChild(photos);
      }

      const deleteBtn = document.createElement("button");
      deleteBtn.type = "button";
      deleteBtn.className = "btn btn-outline-danger btn-sm mt-3 no-pdf";
      deleteBtn.textContent = "删除";
      deleteBtn.addEventListener("click", async () => {
        if (isClearing) return;
        const position = expenses.findIndex(e => e.id === expense.id);
        if (position === -1) return;
        expenses.splice(position, 1);
        item.remove(); // 只删除这一条，其他记录和图片节点保持不变
        updateSummary();
        expense.imageUrls.forEach(url => URL.revokeObjectURL(url));
        try {
          await saveDraft();
          updateSaveStatus("草稿已自动保存到当前浏览器");
        } catch (error) {
          console.error("删除后保存失败：", error);
          updateSaveStatus("保存失败：当前修改可能在刷新后丢失", true);
        }
      });
      item.appendChild(deleteBtn);
      return item;
    }

    function updateSummary() {
      const totalCents = expenses.reduce((sum, expense) =>
        sum + Math.round((Number(expense.amount) || 0) * 100), 0);
      totalAmount.textContent = formatMoney(totalCents / 100);
      generatePdfBtn.disabled = expenses.length === 0;
      if (expenses.length === 0 && !expenseList.querySelector(".empty-message")) {
        const empty = document.createElement("p");
        empty.className = "text-muted empty-message";
        empty.textContent = "暂无报账记录";
        expenseList.appendChild(empty);
      }
    }

    // 页面初始恢复草稿以及清空时调用。
    function renderExpenses() {
      expenseList.replaceChildren();
      for (const expense of expenses) {
        expenseList.appendChild(createExpenseElement(expense));
      }
      updateSummary();
    }

    // 添加新记录时，只新增一张卡片，不重新渲染其他照片。
    function appendExpense(expense) {
      expenseList.querySelector(".empty-message")?.remove();
      expenseList.appendChild(createExpenseElement(expense));
      updateSummary();
    }

    async function restoreDraft() {
      try {
        const saved = await loadDraft();
        expenses = saved.map(record => {
          const files = Array.isArray(record.files) ? record.files : [];
          return { ...record, files, imageUrls: makePreviewUrls(files) };
        });
        nextId = Math.max(0, ...expenses.map(e => Number(e.id) || 0)) + 1;
        renderExpenses();
        updateSaveStatus(expenses.length
          ? `已恢复 ${expenses.length} 条草稿记录（保存在当前浏览器）`
          : "暂无草稿。点击添加后自动保存到当前浏览器。");
        addBtn.disabled = false;
        clearBtn.disabled = false;
      } catch (error) {
        console.error("读取草稿失败：", error);
        expenseList.replaceChildren();
        const message = document.createElement("p");
        message.className = "text-danger";
        message.textContent = "无法读取浏览器草稿，请检查浏览器存储权限。";
        expenseList.appendChild(message);
        updateSaveStatus("草稿存储不可用，暂时禁止添加以免误以为已保存", true);
      }
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      if (isClearing) return;
      const category = document.getElementById("category").value;
      const amount = Number(document.getElementById("amount").value);
      const remark = document.getElementById("remark").value.trim();
      const files = pendingImages.map(item => item.file);
      if (!category || !Number.isFinite(amount) || amount <= 0) {
        alert("请选择报账类别并输入正确金额");
        return;
      }
      if (files.some(file => !file.type.startsWith("image/"))) {
        alert("只能上传图片文件");
        return;
      }
      if (files.some(file => file.size > 15 * 1024 * 1024)) {
        alert("单张图片请不要超过 15 MB");
        return;
      }

      const expense = {
        id: nextId++, category, amount, remark, files,
        imageUrls: makePreviewUrls(files)
      };
      expenses.push(expense);
      appendExpense(expense);
      clearSelectedImages();
      form.reset();
      addBtn.disabled = true;
      updateSaveStatus("正在保存草稿...");
      try {
        await saveDraft();
        updateSaveStatus("草稿已自动保存到当前浏览器");
      } catch (error) {
        console.error("保存草稿失败：", error);
        updateSaveStatus("保存失败：当前修改可能在刷新后丢失，请检查存储空间", true);
        alert("草稿保存失败。请不要刷新页面，并检查浏览器存储空间。");
      } finally {
        addBtn.disabled = false;
      }
    });

    // 为 PDF 单独生成打印版图片，避免 iPhone 的打印引擎无法读取 blob: 临时地址。
    // 同时限制最长边为 1600px，减少手机在打印多张大照片时的内存负担。
    function imageToPrintDataUrl(file) {
      return new Promise((resolve, reject) => {
        if (!(file instanceof Blob)) {
          reject(new Error("草稿中的图片文件无效"));
          return;
        }
        const tempUrl = URL.createObjectURL(file);
        const image = new Image();
        image.onload = () => {
          URL.revokeObjectURL(tempUrl);
          try {
            const width = image.naturalWidth;
            const height = image.naturalHeight;
            if (!width || !height) throw new Error("无法读取图片尺寸");
            const factor = Math.min(1, 1600 / Math.max(width, height));
            const canvas = document.createElement("canvas");
            canvas.width = Math.max(1, Math.round(width * factor));
            canvas.height = Math.max(1, Math.round(height * factor));
            const ctx = canvas.getContext("2d");
            if (!ctx) throw new Error("手机没有足够内存处理图片");
            ctx.fillStyle = "#fff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
            const result = canvas.toDataURL("image/jpeg", 0.85);
            canvas.width = 0;
            canvas.height = 0;
            resolve(result);
          } catch (error) {
            reject(error);
          }
        };
        image.onerror = () => {
          URL.revokeObjectURL(tempUrl);
          reject(new Error("无法读取此图片格式"));
        };
        image.src = tempUrl;
      });
    }

    // 所有动态内容都用 textContent 设置，避免备注里的 HTML 被当作标签执行。
    function printNode(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    async function buildPrintDocument() {
      printDocument.replaceChildren();
      const heading = printNode("h1", "print-heading", "崔莹报账单");
      const date = printNode("div", "print-date", "生成日期：" + new Date().toLocaleDateString("zh-CN"));
      printDocument.append(heading, date);

      // 标准费用汇总表：比直接打印 Bootstrap 卡片更适合 A4。
      const table = printNode("table", "print-table");
      const thead = table.createTHead();
      const headerRow = thead.insertRow();
      for (const [name, cls] of [["序号", "number"], ["报账类别", ""], ["金额", "money"]]) {
        const th = printNode("th", cls, name);
        headerRow.appendChild(th);
      }
      const tbody = table.createTBody();
      let cents = 0;
      for (const [i, expense] of expenses.entries()) {
        const row = tbody.insertRow();
        row.append(
          printNode("td", "number", String(i + 1)),
          printNode("td", "", expense.category),
          printNode("td", "money", formatMoney(expense.amount))
        );
        cents += Math.round((Number(expense.amount) || 0) * 100);
      }
      const totalRow = tbody.insertRow();
      totalRow.className = "total-row";
      const totalLabel = printNode("td", "", "总金额");
      totalLabel.colSpan = 2;
      totalRow.append(totalLabel, printNode("td", "money", formatMoney(cents / 100)));
      printDocument.appendChild(table);

      const detailHeading = printNode("h2", "print-section-title", "明细及凭证");
      printDocument.appendChild(detailHeading);

      let fileCount = 0;
      for (const expense of expenses) fileCount += (expense.files || []).length;
      let done = 0;
      for (const [i, expense] of expenses.entries()) {
        const section = printNode("section", "print-entry");
        const bar = printNode("div", "print-entry-heading");
        bar.append(
          printNode("span", "", (i + 1) + ". " + expense.category),
          printNode("strong", "", formatMoney(expense.amount))
        );
        section.appendChild(bar);
        if (expense.remark) section.appendChild(printNode("p", "print-remark", expense.remark));
        printDocument.appendChild(section);

        const files = Array.isArray(expense.files) ? expense.files : [];
        for (const [idx, file] of files.entries()) {
          previewStatus.textContent = `正在处理照片 ${++done} / ${fileCount} ...`;
          // 每张照片独立一块，浏览器可以在照片之间自然分页。
          let dataUrl;
          try {
            dataUrl = await imageToPrintDataUrl(file);
          } catch (error) {
            const name = file && file.name ? file.name : `第 ${idx + 1} 张图片`;
            throw new Error(`「${name}」转换失败：${error.message}`);
          }
          const figure = printNode("figure", "print-photo");
          const img = document.createElement("img");
          img.alt = `${expense.category} - 凭证 ${idx + 1}`;
          img.src = dataUrl;
          figure.append(img, printNode("figcaption", "", `${i + 1}. ${expense.category} — 凭证 ${idx + 1}`));
          section.appendChild(figure);
          if (img.decode) await img.decode();
        }
      }
    }

    generatePdfBtn.addEventListener("click", async () => {
      if (isClearing || expenses.length === 0) return;
      exportPreview.hidden = false;
      document.documentElement.classList.add("preview-open");
      exportPreview.scrollTop = 0;
      previewStatus.textContent = "正在准备 A4 报账单...";
      confirmPrintBtn.disabled = true;
      closePreviewBtn.disabled = true;
      try {
        await buildPrintDocument();
        previewStatus.textContent = "预览已完成。请先确认所有照片显示正常，再点「打印 / 保存 PDF」。";
        confirmPrintBtn.disabled = false;
      } catch (error) {
        console.error("准备 PDF 失败：", error);
        previewStatus.textContent = "无法生成完整报账单：" + error.message;
        previewStatus.classList.add("text-danger");
        // 有照片失败时禁止导出，避免用户不知情地得到缺少凭证的 PDF。
        confirmPrintBtn.disabled = true;
      } finally {
        closePreviewBtn.disabled = false;
      }
    });

    confirmPrintBtn.addEventListener("click", () => {
      if (!confirmPrintBtn.disabled) window.print();
    });

    closePreviewBtn.addEventListener("click", () => {
      exportPreview.hidden = true;
      document.documentElement.classList.remove("preview-open");
      previewStatus.classList.remove("text-danger");
      printDocument.replaceChildren();
    });

    // 清空所有已添加记录及其照片，并同步清除 IndexedDB 当前草稿。
    clearBtn.addEventListener("click", async () => {
      if (isClearing) return;
      const confirmed = window.confirm(
        "确定清空当前报账单吗？\n所有已添加记录及照片都会从浏览器草稿中删除，无法撤销。建议先生成 PDF。"
      );
      if (!confirmed) return;

      isClearing = true;
      clearBtn.disabled = true;
      addBtn.disabled = true;
      generatePdfBtn.disabled = true;
      updateSaveStatus("正在清空报账单...");
      try {
        // 先持久化删除；若存储失败，保留页面中现有数据，避免误以为已清除。
        await deleteCurrentDraft();
        for (const expense of expenses) {
          (expense.imageUrls || []).forEach(url => URL.revokeObjectURL(url));
        }
        expenses = [];
        nextId = 1;
        clearSelectedImages();
        imagesInput.value = "";
        form.reset();
        renderExpenses();
        updateSaveStatus("报账单已清空，可以开始填写新的一份。");
      } catch (error) {
        console.error("清空报账单失败：", error);
        updateSaveStatus("清空失败，当前记录仍保留，请检查浏览器存储", true);
        alert("清空失败，报账记录尚未删除，请重试。");
      } finally {
        isClearing = false;
        addBtn.disabled = false;
        clearBtn.disabled = false;
        generatePdfBtn.disabled = expenses.length === 0;
      }
    });

    restoreDraft();
  </script>
</body>
</html>
